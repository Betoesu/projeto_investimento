<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO - Painel de Investimentos</title>
    <!-- CSS Crítico Instantâneo para evitar atraso visual ao abrir a janela -->
    <style>
        body {
            background-color: #0b0e11;
            color: #E2E8F0;
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        /* Personalização da barra de rolagem para combinar com o tema dark */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0e11; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #242c37; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0b0e11',
                        card: '#14181e',
                        header_bg: '#12161c',
                        table_head: '#1c222b',
                        primary: '#E2E8F0',
                        muted: '#94A3B8',
                        accent: '#00c47c',
                        accent_bg: 'rgba(0, 196, 124, 0.1)',
                        accent_solid: '#102921',
                        border: '#242c37',
                        row_hover: '#191f27'
                    }
                }
            }
        }
    </script>
    <!-- URLs com versão fixa no jsDelivr (Cache imutável em disco, sem redirects 302 lentos do unpkg) -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>
</head>
<body class="bg-background text-primary font-sans h-screen overflow-hidden select-none">
    <!-- Skeleton inicial instantâneo (0ms) exibido enquanto o React monta -->
    <div id="root" class="h-full">
        <div style="display:flex;flex-direction:column;height:100%;padding:24px;background:#0b0e11;align-items:center;justify-content:center;">
            <div style="width:290px;height:64px;background:#161b22;border:1px solid #242c37;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;">
                <svg width="136" height="42" viewBox="0 0 210 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M96 23H71C66.5 23 64 25.5 64 30V31.5" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M64 38.5V40C64 44.5 66.5 47 71 47H96" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="146" y="23" width="32" height="24" rx="8" stroke="#10B981" stroke-width="6"/>
                    <path d="M24 23H50L24 47H51L63 35H161L185 11" stroke="#E2E8F0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M175 10H186V21" stroke="#E2E8F0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M107 47V23L133 47V23" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div style="width:690px;height:396px;background:#161b22;border:1px solid #242c37;border-radius:16px;"></div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // SVG puro da Logo ZENO
        function ZenoSvg({ width = 136, height = 42 }) {
            return (
                <svg width={width} height={height} viewBox="0 0 210 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    {/* Letra E (Verde - topo e base arredondados) */}
                    <path
                        d="M96 23H71C66.5 23 64 25.5 64 30V31.5"
                        stroke="#10B981"
                        strokeWidth="6"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                    />
                    <path
                        d="M64 38.5V40C64 44.5 66.5 47 71 47H96"
                        stroke="#10B981"
                        strokeWidth="6"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                    />

                    {/* Letra O (Verde - cápsula arredondada) */}
                    <rect
                        x="146"
                        y="23"
                        width="32"
                        height="24"
                        rx="8"
                        stroke="#10B981"
                        strokeWidth="6"
                    />

                    {/* Letra Z Branca + Linha de Tendência e Seta atravessando E, N, O */}
                    <path
                        d="M24 23H50L24 47H51L63 35H161L185 11"
                        stroke="#E2E8F0"
                        strokeWidth="5.5"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                    />
                    {/* Ponta da seta branca no canto superior direito */}
                    <path
                        d="M175 10H186V21"
                        stroke="#E2E8F0"
                        strokeWidth="5.5"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                    />

                    {/* Letra N (Verde - sobreposta à linha branca horizontal) */}
                    <path
                        d="M107 47V23L133 47V23"
                        stroke="#10B981"
                        strokeWidth="6"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                    />
                </svg>
            );
        }

        // Card da Logo ZENO usado nas 3 telas iniciais e no carregamento
        function ZenoLogoCard({ className = "w-[290px] h-[64px]" }) {
            return (
                <div className={`${className} bg-[#161b22] border border-[#242c37] rounded-xl flex items-center justify-center shadow-md`}>
                    <ZenoSvg width={136} height={42} />
                </div>
            );
        }

        // Ícone de cursor (seta de clique) das ilustrações
        function CursorPointer({ className = "" }) {
            return (
                <svg
                    className={`w-7 h-7 drop-shadow-[0_4px_6px_rgba(0,0,0,0.65)] pointer-events-none ${className}`}
                    viewBox="0 0 28 28"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M6 4L22 14.5L14.5 16.5L18.5 23.5L15 25.5L11 18.5L6 22.5V4Z"
                        fill="#14181f"
                        stroke="#FFFFFF"
                        strokeWidth="2.2"
                        strokeLinejoin="round"
                    />
                </svg>
            );
        }

        // Ilustração do Celular para cada um dos 3 Passos
        function PhoneIllustration({ step }) {
            return (
                <div className="w-[226px] h-[272px] bg-[#14181f] rounded-t-[32px] border-t-[3px] border-x-[3px] border-[#2c3542] shadow-2xl relative flex flex-col px-3.5 pt-2.5 overflow-hidden">
                    {/* Notch superior do celular */}
                    <div className="w-16 h-3.5 bg-[#090c10] rounded-full mx-auto mb-2.5 shrink-0"></div>

                    {step === 1 && (
                        <div className="flex flex-col flex-1">
                            {/* Topo do App Inter */}
                            <div className="flex items-center justify-between px-0.5 py-1 relative">
                                {/* Ícone de Perfil Destacado */}
                                <div className="relative">
                                    <div className="w-12 h-12 -m-1 rounded-full bg-[#00c47c]/15 border border-[#00c47c]/50 flex items-center justify-center">
                                        <div className="w-9 h-9 rounded-full bg-[#00c47c] flex items-center justify-center shadow-lg shadow-[#00c47c]/30">
                                            <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <circle cx="12" cy="8" r="4" />
                                                <path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5" />
                                            </svg>
                                        </div>
                                    </div>
                                    <CursorPointer className="absolute -bottom-5 -right-4 z-20" />
                                </div>

                                <span className="text-white font-bold text-[15px] tracking-tight">inter</span>

                                {/* Sino de notificação com bolinha laranja */}
                                <div className="relative pr-1">
                                    <svg className="w-4 h-4 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                                    </svg>
                                    <span className="w-1.5 h-1.5 rounded-full bg-[#ff6b4a] absolute top-0 right-1"></span>
                                </div>
                            </div>

                            {/* Card Skeleton Principal */}
                            <div className="bg-[#222934] rounded-xl p-3 mt-2.5 h-[72px] flex flex-col justify-center space-y-2">
                                <div className="w-16 h-1.5 bg-[#323c4a] rounded-full"></div>
                                <div className="w-28 h-1.5 bg-[#323c4a] rounded-full"></div>
                                <div className="w-20 h-1.5 bg-[#323c4a] rounded-full"></div>
                            </div>

                            {/* Pontos do carrossel */}
                            <div className="flex justify-center space-x-1.5 my-2">
                                <span className="w-1 h-1 rounded-full bg-[#94A3B8]"></span>
                                <span className="w-1 h-1 rounded-full bg-[#323c4a]"></span>
                            </div>

                            {/* 4 Atalhos quadrados */}
                            <div className="grid grid-cols-4 gap-2">
                                {[1, 2, 3, 4].map(i => (
                                    <div key={i} className="flex flex-col items-center">
                                        <div className="w-full h-8 bg-[#222934] rounded-lg"></div>
                                        <div className="w-full h-1 bg-[#323c4a] rounded-full mt-1.5"></div>
                                    </div>
                                ))}
                            </div>

                            {/* Seção inferior */}
                            <div className="w-20 h-1.5 bg-[#323c4a] rounded-full mt-3.5 mb-2"></div>
                            <div className="bg-[#222934] rounded-t-xl p-2.5 flex items-center space-x-2.5 flex-1">
                                <div className="w-5 h-5 bg-[#323c4a] rounded-md shrink-0"></div>
                                <div className="space-y-1.5 flex-1">
                                    <div className="w-20 h-1.5 bg-[#323c4a] rounded-full"></div>
                                    <div className="w-14 h-1.5 bg-[#323c4a] rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="flex flex-col flex-1">
                            {/* Barra de navegação topo */}
                            <div className="flex items-center justify-between px-0.5 py-0.5">
                                <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="19" y1="12" x2="5" y2="12" />
                                    <polyline points="12 19 5 12 12 5" />
                                </svg>
                                <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                                </svg>
                            </div>

                            {/* Perfil do usuário */}
                            <div className="flex items-center justify-between mt-2 mb-2.5">
                                <div className="flex items-center space-x-2">
                                    <div className="w-8 h-8 rounded-full bg-[#222934] flex items-center justify-center text-white shrink-0">
                                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <circle cx="12" cy="8" r="3.5" />
                                            <path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5" />
                                        </svg>
                                    </div>
                                    <div className="leading-none">
                                        <div className="text-[7.5px] font-bold text-white leading-tight">Cristian Bernardes<br/>da Silva</div>
                                        <span className="inline-block bg-[#d9822b] text-[#0f1319] text-[5.5px] font-extrabold px-1.5 py-[1px] rounded mt-0.5">Digital</span>
                                    </div>
                                </div>
                                <svg className="w-3 h-3 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <polyline points="9 18 15 12 9 6" />
                                </svg>
                            </div>

                            {/* 3 Cards Superiores */}
                            <div className="grid grid-cols-3 gap-1.5 mb-2.5">
                                <div className="bg-[#1e242d] rounded-lg p-1.5 flex flex-col justify-between h-[48px]">
                                    <svg className="w-3.5 h-3.5 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                                        <rect x="3" y="5" width="18" height="14" rx="2" />
                                        <line x1="3" y1="10" x2="21" y2="10" />
                                    </svg>
                                    <span className="text-[6.5px] text-[#cbd5e1] leading-tight">Dados<br/>Bancários</span>
                                </div>
                                <div className="bg-[#1e242d] rounded-lg p-1.5 flex flex-col justify-between h-[48px]">
                                    <svg className="w-3.5 h-3.5 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                        <polyline points="14 2 14 8 20 8" />
                                    </svg>
                                    <span className="text-[6.5px] text-[#cbd5e1] leading-tight">Informe de<br/>rendimentos</span>
                                </div>
                                <div className="bg-[#1e242d] rounded-lg p-1.5 flex flex-col justify-between h-[48px]">
                                    <svg className="w-3.5 h-3.5 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                                        <path d="M12 14l4-4" />
                                        <path d="M3.34 19a10 10 0 1 1 17.32 0" />
                                    </svg>
                                    <span className="text-[6.5px] text-[#cbd5e1] leading-tight">Meu Crédito</span>
                                </div>
                            </div>

                            {/* Título Central de Segurança */}
                            <div className="flex items-center justify-between mb-1.5">
                                <span className="text-[8.5px] font-bold text-white">Central de Segurança</span>
                                <svg className="w-3 h-3 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <polyline points="9 18 15 12 9 6" />
                                </svg>
                            </div>

                            {/* 2 Cards de Segurança */}
                            <div className="grid grid-cols-2 gap-2 flex-1 pb-2">
                                <div className="bg-[#1b2129] border border-[#2a3340] rounded-xl p-2 flex flex-col justify-between relative">
                                    <span className="text-[7.5px] font-semibold text-white">Meus Limites</span>
                                    <div className="flex items-end justify-between">
                                        <span className="text-[6px] text-[#8b95a5] leading-tight">Gestão de limites<br/>diários</span>
                                        <svg className="w-3 h-3 text-[#94A3B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <line x1="4" y1="21" x2="4" y2="14" />
                                            <line x1="4" y1="10" x2="4" y2="3" />
                                            <line x1="12" y1="21" x2="12" y2="12" />
                                            <line x1="12" y1="8" x2="12" y2="3" />
                                            <line x1="20" y1="21" x2="20" y2="16" />
                                            <line x1="20" y1="12" x2="20" y2="3" />
                                        </svg>
                                    </div>
                                </div>

                                {/* Card Destacado: Token e Autorização */}
                                <div className="bg-[#142923] border border-[#00c47c] rounded-xl p-2 flex flex-col justify-between relative shadow-md shadow-[#00c47c]/10">
                                    <span className="text-[7.5px] font-bold text-white leading-tight">Token e<br/>Autorização</span>
                                    <span className="text-[6px] text-[#8b95a5] leading-tight">Autenticar com<br/>iSafe ou QR</span>
                                    <CursorPointer className="absolute -bottom-2 -right-2 z-20" />
                                </div>
                            </div>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="flex flex-col flex-1">
                            {/* Barra de navegação topo */}
                            <div className="flex items-center justify-between px-0.5 py-0.5 mb-2">
                                <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="19" y1="12" x2="5" y2="12" />
                                    <polyline points="12 19 5 12 12 5" />
                                </svg>
                                <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                                </svg>
                            </div>

                            {/* Opção 1: Autenticar via iSafe */}
                            <div className="bg-[#1a2028] border border-[#28313e] rounded-xl p-2.5 mb-2">
                                <div className="flex items-center space-x-2 mb-1.5">
                                    <div className="w-6 h-6 rounded-lg bg-[#123126] flex items-center justify-center text-[#00c47c] shrink-0">
                                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                        </svg>
                                    </div>
                                    <span className="text-[8.5px] font-bold text-white">Autenticar via iSafe</span>
                                </div>
                                <p className="text-[6.5px] text-[#8b95a5] leading-tight">
                                    Token para autenticar as suas transações e solicitações.
                                </p>
                            </div>

                            {/* Opção 2 (DESTACADA): Acessar via QR Code */}
                            <div className="bg-[#142923] border border-[#00c47c] rounded-xl p-2.5 mb-2 relative shadow-md shadow-[#00c47c]/10">
                                <div className="flex items-center space-x-2 mb-1.5">
                                    <div className="w-6 h-6 rounded-lg bg-[#163a2d] flex items-center justify-center text-[#00c47c] shrink-0">
                                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <rect x="3" y="3" width="7" height="7" />
                                            <rect x="14" y="3" width="7" height="7" />
                                            <rect x="3" y="14" width="7" height="7" />
                                            <rect x="14" y="14" width="7" height="7" />
                                        </svg>
                                    </div>
                                    <span className="text-[8.5px] font-bold text-white">Acessar via QR Code</span>
                                </div>
                                <p className="text-[6.5px] text-[#8b95a5] leading-tight">
                                    Para acessar o Internet Banking Web pelo seu computador.
                                </p>
                                <CursorPointer className="absolute -bottom-2.5 right-1 z-20" />
                            </div>

                            {/* Opção 3: Reconhecer Transação */}
                            <div className="bg-[#1a2028] border border-[#28313e] rounded-t-xl p-2.5 flex-1">
                                <div className="flex items-center space-x-2 mb-1">
                                    <div className="w-6 h-6 rounded-lg bg-[#123126] flex items-center justify-center text-[#00c47c] shrink-0">
                                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <polyline points="23 4 23 10 17 10" />
                                            <polyline points="1 20 1 14 7 14" />
                                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                                        </svg>
                                    </div>
                                    <span className="text-[8.5px] font-bold text-white">Reconhecer Transação</span>
                                </div>
                                <p className="text-[6.5px] text-[#8b95a5] leading-tight">
                                    Para reconhecer as transações e...
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Componente de Cabeçalho de Coluna com Hover Detalhado para Ordenação Ativa
        function SortableHeader({
            colKey,
            label,
            colSpan,
            align = "center",
            isActive,
            icon,
            activeTitle,
            activeDescription,
            actionHint,
            onClick
        }) {
            const alignClass =
                align === "left"
                    ? "justify-start"
                    : align === "right"
                        ? "justify-end pr-2"
                        : "justify-center";

            const tooltipPositionClass =
                align === "left"
                    ? "left-0"
                    : align === "right"
                        ? "right-0"
                        : "left-1/2 -translate-x-1/2";

            return (
                <div
                    onClick={onClick}
                    className={`${colSpan} relative group flex items-center ${alignClass} cursor-pointer select-none`}
                >
                    {/* Pílula interativa da coluna */}
                    <div
                        className={`inline-flex items-center px-2.5 py-1 -mx-2.5 -my-1 rounded-md border transition-all duration-150 ${
                            isActive
                                ? 'text-[#00c47c] bg-[#00c47c]/10 border-[#00c47c]/30 group-hover:bg-[#00c47c]/20 group-hover:border-[#00c47c] group-hover:shadow-[0_0_12px_rgba(0,196,124,0.2)]'
                                : 'text-[#cbd5e1] border-transparent group-hover:text-white group-hover:bg-[#252d39] group-hover:border-[#333e4f]'
                        }`}
                    >
                        <span>{label}</span>
                        <span
                            className={`ml-1.5 inline-flex items-center justify-center w-4 h-4 rounded text-[11px] font-bold transition-transform duration-150 group-hover:scale-110 ${
                                isActive
                                    ? 'bg-[#00c47c] text-[#0b0e11]'
                                    : 'text-[#94A3B8] group-hover:text-white'
                            }`}
                        >
                            {icon}
                        </span>
                    </div>

                    {/* Card de Hover Detalhado quando a ordenação está ativa (ou dica quando inativa) */}
                    <div
                        className={`absolute top-full mt-2.5 ${tooltipPositionClass} z-50 opacity-0 invisible translate-y-1 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 transition-all duration-150 pointer-events-none`}
                    >
                        {isActive ? (
                            <div className="w-64 bg-[#11161c] border border-[#00c47c] rounded-xl p-3.5 shadow-2xl text-left">
                                <div className="flex items-center justify-between mb-1.5">
                                    <div className="flex items-center space-x-1.5">
                                        <span className="w-2 h-2 rounded-full bg-[#00c47c] animate-pulse"></span>
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-[#00c47c]">
                                            Ordenação Ativa
                                        </span>
                                    </div>
                                    <span className="px-1.5 py-0.5 rounded bg-[#00c47c]/15 text-[#00c47c] text-[10px] font-bold">
                                        {label} {icon}
                                    </span>
                                </div>
                                <div className="text-xs font-semibold text-white mb-1">
                                    {activeTitle}
                                </div>
                                <p className="text-[11px] text-[#94A3B8] font-normal leading-snug">
                                    {activeDescription}
                                </p>
                                <div className="mt-2.5 pt-2 border-t border-[#1e2631] flex items-center justify-between text-[10px] text-[#cbd5e1]">
                                    <span>{actionHint}</span>
                                    <span className="text-[#00c47c] font-bold">Clique ↻</span>
                                </div>
                            </div>
                        ) : (
                            <div className="w-48 bg-[#141920] border border-[#2a3441] rounded-lg px-3 py-2 shadow-xl text-left">
                                <div className="text-[10px] font-semibold text-[#94A3B8] uppercase tracking-wider mb-0.5">
                                    Ordenação Inativa
                                </div>
                                <div className="text-[11px] text-white font-normal">
                                    Clique para ordenar por <strong className="text-[#00c47c]">{label}</strong>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [investimentos, setInvestimentos] = useState([]);
            
            // Filtros
            const [tiposFiltro, setTiposFiltro] = useState([]); // Array de tipos ativos
            const [invMin, setInvMin] = useState('');
            const [invMax, setInvMax] = useState('');
            const [anoMin, setAnoMin] = useState('');
            const [anoMax, setAnoMax] = useState('');
            const [showFiltrosPanel, setShowFiltrosPanel] = useState(false);
            
            // Extrai todos os tipos únicos disponíveis nos dados
            const todosOsTipos = useMemo(() => {
                const tipos = new Set(investimentos.map(inv => inv.tipo_investimento).filter(Boolean));
                return Array.from(tipos);
            }, [investimentos]);

            // Ordenação
            const [sortKey, setSortKey] = useState('produto');
            const [sortDirection, setSortDirection] = useState('asc');
            const [isentoTop, setIsentoTop] = useState(false); // Toggle especial para Isento IR
            
            const [selectedRow, setSelectedRow] = useState(null);
            const [expandedRow, setExpandedRow] = useState(null); // Linha aberta com duplo clique
            const [valorInvestirInput, setValorInvestirInput] = useState(''); // Apenas input visual (sem lógica)
            const [isLoading, setIsLoading] = useState(false);
            const [passoInicial, setPassoInicial] = useState(1);
            const [loadingProgress, setLoadingProgress] = useState(0);

            useEffect(() => {
                window.addEventListener('pywebviewready', function() {
                    window.pywebview.api.obter_investimentos().then(dados => {
                        if (dados && dados.length > 0) setInvestimentos(dados);
                    });
                });
            }, []);

            useEffect(() => {
                if (!isLoading) {
                    setLoadingProgress(0);
                    return;
                }
                setLoadingProgress(15);
                const interval = setInterval(() => {
                    setLoadingProgress(prev => {
                        if (prev >= 92) return prev;
                        const increment = prev < 50 ? 7 : prev < 75 ? 3 : 1;
                        return Math.min(92, prev + increment);
                    });
                }, 350);
                return () => clearInterval(interval);
            }, [isLoading]);

            const iniciarExtracao = () => {
                setIsLoading(true);
                if (window.pywebview) {
                    window.pywebview.api.iniciar_extracao().then(dados => {
                        setLoadingProgress(100);
                        setInvestimentos(dados);
                        setIsLoading(false);
                    }).catch(err => {
                        alert("Erro ao extrair: " + err);
                        setIsLoading(false);
                    });
                } else {
                    setTimeout(() => {
                        setLoadingProgress(100);
                        setInvestimentos([
                            { id: 1, produto: 'LCI 300 DIAS', rendimento: 'Rende até 94% do CDI', investimento_minimo: 'R$ 50,00', isento_ir: true, vencimento: '09/02/2020', tipo_investimento: 'LCI' },
                            { id: 2, produto: 'LCI DI 720', rendimento: 'Rende até 94% do CDI', investimento_minimo: 'R$ 54,00', isento_ir: true, vencimento: '09/09/2020', tipo_investimento: 'LCI' },
                            { id: 3, produto: 'LCA ORIGINAL - 90% do CDI', rendimento: 'Rende até 93% do CDI', investimento_minimo: 'R$ 100,00', isento_ir: false, vencimento: '15/02/2027', tipo_investimento: 'LCA' },
                            { id: 4, produto: 'LCI 550 DIAS', rendimento: 'Rende até 10% do CDI', investimento_minimo: 'R$ 50,00', isento_ir: true, vencimento: '20/09/2021', tipo_investimento: 'LCI' },
                            { id: 5, produto: 'LCI LIQUIDEZ 15 MESES', rendimento: 'Rende até 95% do CDI', investimento_minimo: 'R$ 50,00', isento_ir: true, vencimento: '20/09/2021', tipo_investimento: 'LCI' },
                            { id: 6, produto: 'LCI LIQUIDEZ 9 MESES', rendimento: 'Rende até 0,25 do CDI', investimento_minimo: 'R$ 56,00', isento_ir: true, vencimento: '22/09/2029', tipo_investimento: 'LCI' },
                            { id: 7, produto: 'LCI PRE 1000 DIAS', rendimento: 'Rende até 12.99% a.a.', investimento_minimo: 'R$ 56,00', isento_ir: true, vencimento: '04/06/2029', tipo_investimento: 'LCI' }
                        ]);
                        setIsLoading(false);
                    }, 2000);
                }
            };

            const toggleTipoFiltro = (f) => {
                if (tiposFiltro.includes(f)) {
                    setTiposFiltro(tiposFiltro.filter(item => item !== f));
                } else {
                    setTiposFiltro([...tiposFiltro, f]);
                }
            };

            const handleSort = (key) => {
                if (key === 'isento_ir') {
                    setIsentoTop(!isentoTop);
                    return;
                }
                if (sortKey === key) {
                    setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortKey(key);
                    if (['rendimento', 'investimento_minimo', 'vencimento'].includes(key)) {
                        setSortDirection('desc');
                    } else {
                        setSortDirection('asc');
                    }
                }
            };
            
            const extrairValorNumerico = (texto) => {
                if (!texto || texto === '-') return 0;
                try {
                    let val = String(texto).replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
                    return parseFloat(val) || 0;
                } catch { return 0; }
            };

            const extrairAno = (texto) => {
                if (!texto || texto === '-') return new Date().getFullYear();
                try {
                    const partes = texto.split('/');
                    if (partes.length === 3) return parseInt(partes[2]);
                    return 9999;
                } catch { return 9999; }
            };
            
            const extrairRendimentoNumerico = (texto) => {
                if (!texto) return 0;
                let t = texto.toLowerCase();
                try {
                    if (t.includes('ipca')) {
                        let match = t.match(/ipca\s*\+\s*([\d,.]+)/);
                        return match ? parseFloat(match[1].replace(',', '.')) : 0;
                    }
                    let match = t.match(/([\d,.]+)\s*%/);
                    return match ? parseFloat(match[1].replace(',', '.')) : 0;
                } catch { return 0; }
            };

            const filteredAndSortedInvestimentos = useMemo(() => {
                // 1. Filtragem
                const nenhum_filtro_ativo = tiposFiltro.length === 0;

                let filtrados = investimentos.filter(inv => {
                    const tipoInv = inv.tipo_investimento || '';
                    const matchTipo = tiposFiltro.includes(tipoInv) || nenhum_filtro_ativo;
                    const matchBusca = inv.produto.toLowerCase().includes(searchTerm.toLowerCase());
                    
                    const valor = extrairValorNumerico(inv.investimento_minimo);
                    const vMin = invMin ? parseFloat(invMin.replace(',', '.')) : 0;
                    const vMax = invMax ? parseFloat(invMax.replace(',', '.')) : Infinity;
                    const matchInv = valor >= vMin && valor <= vMax;
                    
                    const ano = extrairAno(inv.vencimento);
                    const aMin = anoMin ? parseInt(anoMin) : 0;
                    const aMax = anoMax ? parseInt(anoMax) : Infinity;
                    const matchAno = ano >= aMin && ano <= aMax;
                    
                    return matchTipo && matchBusca && matchInv && matchAno;
                });

                // 2. Ordenação (Cascata do Python: Alfabético -> Coluna Ativa -> Isento IR no topo)
                filtrados.sort((a, b) => a.produto.localeCompare(b.produto));
                
                if (sortKey) {
                    filtrados.sort((a, b) => {
                        let valA, valB;
                        if (sortKey === 'investimento_minimo') {
                            valA = extrairValorNumerico(a.investimento_minimo);
                            valB = extrairValorNumerico(b.investimento_minimo);
                        } else if (sortKey === 'vencimento') {
                            const dateA = a.vencimento === '-' ? 0 : new Date(a.vencimento.split('/').reverse().join('-')).getTime();
                            const dateB = b.vencimento === '-' ? 0 : new Date(b.vencimento.split('/').reverse().join('-')).getTime();
                            valA = dateA || 0; valB = dateB || 0;
                        } else if (sortKey === 'rendimento') {
                            valA = extrairRendimentoNumerico(a.rendimento);
                            valB = extrairRendimentoNumerico(b.rendimento);
                        } else {
                            valA = a.produto;
                            valB = b.produto;
                        }

                        if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                        if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                if (isentoTop) {
                    filtrados.sort((a, b) => {
                        const aIsento = a.isento_ir ? 1 : 0;
                        const bIsento = b.isento_ir ? 1 : 0;
                        return bIsento - aIsento;
                    });
                }

                return filtrados;
            }, [investimentos, tiposFiltro, searchTerm, invMin, invMax, anoMin, anoMax, sortKey, sortDirection, isentoTop]);

            const getSortIcon = (key) => {
                if (key === 'isento_ir') return isentoTop ? '↑' : '↕';
                if (sortKey !== key) return '↕';
                
                if (['rendimento', 'investimento_minimo', 'vencimento'].includes(key)) {
                    return sortDirection === 'desc' ? '↑' : '↓';
                }
                return sortDirection === 'asc' ? '↑' : '↓';
            };

            const avancarPasso = () => {
                if (passoInicial < 3) {
                    setPassoInicial(passoInicial + 1);
                } else {
                    iniciarExtracao();
                }
            };

            const handleDoubleClickRow = (rowKey) => {
                if (expandedRow === rowKey) {
                    setExpandedRow(null);
                } else {
                    setExpandedRow(rowKey);
                    setValorInvestirInput('');
                }
            };

            // Tela inicial (3 Passos de Onboarding) ou Tela de Carregamento com Logo e Barra
            if (investimentos.length === 0) {
                return (
                    <div className="flex flex-col h-full p-6 bg-[#0b0e11] items-center justify-center">
                        {/* Logo ZENO sempre visível nas 3 telas iniciais e na tela de carregamento */}
                        <div className="mb-7">
                            <ZenoLogoCard />
                        </div>

                        {isLoading ? (
                            <div className="w-[540px] bg-[#161b22] border border-[#242c37] rounded-2xl p-10 flex flex-col items-center shadow-2xl">
                                <h2 className="text-xl font-bold text-white mb-2">Sincronizando com o Banco</h2>
                                <p className="text-sm text-[#8b95a5] text-center mb-6">
                                    Aguardando leitura do QR Code e extração dos investimentos...
                                </p>

                                {/* Barra de Carregamento */}
                                <div className="w-full bg-[#232b36] h-3 rounded-full overflow-hidden border border-[#2c3542] mb-3">
                                    <div
                                        className="h-full bg-[#00c47c] rounded-full transition-all duration-300 ease-out relative overflow-hidden"
                                        style={{ width: `${loadingProgress}%` }}
                                    >
                                        <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/25 to-transparent animate-pulse"></div>
                                    </div>
                                </div>

                                <div className="w-full flex justify-between items-center text-xs text-[#8b95a5]">
                                    <span>Acompanhe o navegador Chrome aberto</span>
                                    <span className="text-[#00c47c] font-bold">{loadingProgress}%</span>
                                </div>
                            </div>
                        ) : (
                            <div className="w-[690px] h-[396px] bg-[#161b22] border border-[#242c37] rounded-2xl flex overflow-hidden shadow-2xl">
                                {/* Coluna da Esquerda: Texto e Indicadores 1, 2, 3 */}
                                <div className="w-[55%] p-9 flex flex-col justify-between border-r border-[#232b36]">
                                    <div>
                                        {/* Badge PASSO 01 / 02 / 03 */}
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-lg border border-[#144c39] bg-[#0f2922] text-[#00c47c] text-xs font-bold tracking-wider uppercase mb-5">
                                            PASSO 0{passoInicial}
                                        </div>

                                        {passoInicial === 1 && (
                                            <div>
                                                <h2 className="text-[32px] font-bold text-[#00c47c] leading-tight mb-4">
                                                    Abrir o Perfil
                                                </h2>
                                                <p className="text-[#8b95a5] text-[15px] leading-relaxed">
                                                    No aplicativo do Inter, toque no <strong className="text-white font-semibold">ícone de perfil</strong> no canto superior esquerdo da tela inicial
                                                </p>
                                            </div>
                                        )}

                                        {passoInicial === 2 && (
                                            <div>
                                                <h2 className="text-[32px] font-bold text-[#00c47c] leading-[1.15] mb-4">
                                                    Token e<br />Autorização
                                                </h2>
                                                <p className="text-[#8b95a5] text-[15px] leading-relaxed">
                                                    Role até a seção 'Central de segurança' e toque em <strong className="text-white font-semibold">'Token e Autorização'</strong>
                                                </p>
                                            </div>
                                        )}

                                        {passoInicial === 3 && (
                                            <div>
                                                <h2 className="text-[32px] font-bold text-[#00c47c] leading-[1.15] mb-4">
                                                    Acessar via<br />QR Code
                                                </h2>
                                                <p className="text-[#8b95a5] text-[15px] leading-relaxed">
                                                    Toque em <strong className="text-white font-semibold">'Acessar via QR Code'</strong>, confirme o site e pressione <strong className="text-white font-semibold">'Ler o QR Code'</strong>
                                                </p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Números 1, 2, 3 clicáveis para voltar ou avançar */}
                                    <div className="flex items-center space-x-3">
                                        {[1, 2, 3].map((num) => (
                                            <button
                                                key={num}
                                                type="button"
                                                onClick={() => setPassoInicial(num)}
                                                title={`Ir para o Passo 0${num}`}
                                                className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold transition-all cursor-pointer ${
                                                    passoInicial === num
                                                        ? 'bg-[#00c47c] text-[#0f1319] shadow-md shadow-[#00c47c]/20'
                                                        : 'bg-[#232b36] text-[#94A3B8] hover:bg-[#2d3746] hover:text-white'
                                                }`}
                                            >
                                                {num}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Coluna da Direita: Ilustração do Celular + Botão Próximo */}
                                <div className="w-[45%] flex flex-col justify-between bg-[#161b22]">
                                    {/* Área superior verde-escura com o mockup do celular */}
                                    <div className="flex-1 bg-[#0c2119] relative overflow-hidden flex items-end justify-center pt-5 px-6">
                                        <PhoneIllustration step={passoInicial} />
                                    </div>

                                    {/* Rodapé da coluna direita com o botão Próximo ↗ */}
                                    <div className="h-[88px] bg-[#161b22] flex items-center justify-end px-8">
                                        <button
                                            type="button"
                                            onClick={avancarPasso}
                                            className="px-7 py-3 bg-[#00c47c] hover:bg-[#00d688] text-[#0f1319] font-bold text-base rounded-full transition-all flex items-center space-x-2 shadow-lg shadow-[#00c47c]/15 cursor-pointer"
                                        >
                                            <span>Próximo</span>
                                            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                <line x1="7" y1="17" x2="17" y2="7" />
                                                <polyline points="7 7 17 7 17 17" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // Tela de Resultados (Dashboard de Investimentos)
            return (
                <div className="flex flex-col h-full bg-[#0b0e11]">
                    {/* Top Navbar com Logo ZENO, Busca, Filtros e Contador */}
                    <div className="flex justify-between items-center px-10 py-4 bg-[#12161c] border-b border-[#1c232d] shrink-0">
                        <div className="flex items-center">
                            <ZenoSvg width={118} height={36} />
                        </div>
                        
                        <div className="flex items-center justify-center w-[360px] relative">
                            <div className="relative w-full">
                                <svg className="absolute left-3.5 top-3 w-4 h-4 text-[#64748b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="11" cy="11" r="8" />
                                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                                </svg>
                                <input 
                                    type="text" 
                                    placeholder="Pesquisar produto" 
                                    className="w-full bg-[#1b212a] border border-[#262f3b] rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-accent text-white placeholder-[#64748b]"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="flex items-center space-x-3.5 relative">
                            <button 
                                onClick={() => setShowFiltrosPanel(!showFiltrosPanel)}
                                className="flex items-center px-4 py-2.5 bg-[#0f241e] border border-[#145940] hover:border-[#00c47c] text-white text-sm rounded-lg transition-colors">
                                <svg className="w-4 h-4 mr-2.5 text-[#00c47c]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                                </svg>
                                <span>Filtros</span>
                                <svg className="w-4 h-4 ml-2.5 text-[#00c47c]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    {showFiltrosPanel ? (
                                        <polyline points="18 15 12 9 6 15" />
                                    ) : (
                                        <polyline points="6 9 12 15 18 9" />
                                    )}
                                </svg>
                            </button>

                            <div className="px-5 py-2.5 bg-[#102921] border border-[#144937] text-[#e2e8f0] rounded-lg text-sm font-medium">
                                {filteredAndSortedInvestimentos.length} Produtos Encontrados
                            </div>

                            {/* Painel de Filtros Avançados */}
                            {showFiltrosPanel && (
                                <div className="absolute top-14 right-[200px] bg-[#161b22] border border-[#26303d] rounded-xl p-5 shadow-2xl z-50 w-80">
                                    <div className="mb-4">
                                        <label className="text-xs text-muted font-bold uppercase mb-2 block">Tipos de Investimento</label>
                                        <div className="flex flex-wrap gap-2">
                                            {todosOsTipos.map(f => {
                                                const isActive = tiposFiltro.includes(f);
                                                return (
                                                    <div key={f} 
                                                        onClick={() => toggleTipoFiltro(f)}
                                                        className={`px-3.5 py-1 border rounded-full text-xs cursor-pointer transition-colors ${isActive ? 'bg-accent_bg border-accent text-accent' : 'bg-transparent border-border text-muted hover:text-white'}`}>
                                                        {f}
                                                    </div>
                                                );
                                            })}
                                            {todosOsTipos.length === 0 && <span className="text-xs text-muted">Nenhum dado disponível.</span>}
                                        </div>
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-xs text-muted font-bold uppercase mb-2 block">Investimento (R$)</label>
                                        <div className="flex space-x-2">
                                            <input type="text" placeholder="Mínimo" value={invMin} onChange={e => setInvMin(e.target.value)} className="w-1/2 bg-[#0b0e11] border border-border rounded-md px-2.5 py-1.5 text-sm text-white focus:border-accent outline-none" />
                                            <input type="text" placeholder="Máximo" value={invMax} onChange={e => setInvMax(e.target.value)} className="w-1/2 bg-[#0b0e11] border border-border rounded-md px-2.5 py-1.5 text-sm text-white focus:border-accent outline-none" />
                                        </div>
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-xs text-muted font-bold uppercase mb-2 block">Vencimento (Ano)</label>
                                        <div className="flex space-x-2">
                                            <input type="text" placeholder="Ano Mín" value={anoMin} onChange={e => setAnoMin(e.target.value)} className="w-1/2 bg-[#0b0e11] border border-border rounded-md px-2.5 py-1.5 text-sm text-white focus:border-accent outline-none" />
                                            <input type="text" placeholder="Ano Máx" value={anoMax} onChange={e => setAnoMax(e.target.value)} className="w-1/2 bg-[#0b0e11] border border-border rounded-md px-2.5 py-1.5 text-sm text-white focus:border-accent outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end">
                                        <button onClick={() => { setTiposFiltro([]); setInvMin(''); setInvMax(''); setAnoMin(''); setAnoMax(''); }} className="text-xs text-muted hover:text-white">Limpar Filtros</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Barra de Filtros Selecionados */}
                    <div className="px-10 pt-5 pb-2 shrink-0 min-h-[48px] flex items-center">
                        {tiposFiltro.length > 0 && (
                            <div className="flex items-center">
                                <span className="text-xs text-[#64748b] mr-3.5">Filtros Selecionados</span>
                                <div className="flex space-x-2.5">
                                    {tiposFiltro.map(f => (
                                        <div
                                            key={f} 
                                            className="flex items-center px-3.5 py-1.5 border border-[#28313e] bg-[#161b22] rounded-full text-xs transition-colors hover:bg-[#1e2530] cursor-pointer"
                                            title="Clique para remover"
                                            onClick={() => toggleTipoFiltro(f)}
                                        >
                                            <span className="text-white font-medium">{f}</span>
                                            <span className="ml-2.5 text-[#64748b] hover:text-white leading-none">×</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Container Principal da Tabela (min-h-0 permite que o popover de hover não seja cortado) */}
                    <div className="flex-1 min-h-0 px-16 py-3 flex flex-col">
                        {/* Cabeçalho da Tabela com Hover Detalhado */}
                        <div className="grid grid-cols-12 bg-[#1c222b] rounded-t-lg py-4 px-7 text-xs font-semibold text-[#cbd5e1] border-b border-[#252d38] shrink-0 relative z-20">
                            <SortableHeader
                                colKey="produto"
                                label="Produto"
                                colSpan="col-span-4"
                                align="left"
                                isActive={sortKey === 'produto'}
                                icon={getSortIcon('produto')}
                                activeTitle={sortDirection === 'asc' ? 'Ordem Alfabética (A → Z)' : 'Ordem Alfabética Inversa (Z → A)'}
                                activeDescription={sortDirection === 'asc' ? 'Listando os investimentos em sequência alfabética de A até Z.' : 'Listando os investimentos em sequência alfabética inversa de Z até A.'}
                                actionHint="Inverter ordem alfabética"
                                onClick={() => handleSort('produto')}
                            />

                            <SortableHeader
                                colKey="rendimento"
                                label="Rendimento"
                                colSpan="col-span-3"
                                align="center"
                                isActive={sortKey === 'rendimento'}
                                icon={getSortIcon('rendimento')}
                                activeTitle={sortDirection === 'desc' ? 'Maior Rendimento no Topo (↑)' : 'Menor Rendimento no Topo (↓)'}
                                activeDescription={sortDirection === 'desc' ? 'Priorizando os títulos com as maiores taxas (% CDI, IPCA+ ou a.a.) primeiro.' : 'Exibindo os títulos com as menores taxas de retorno primeiro.'}
                                actionHint="Alternar maior / menor taxa"
                                onClick={() => handleSort('rendimento')}
                            />

                            <SortableHeader
                                colKey="investimento_minimo"
                                label="Inv. Mínimo"
                                colSpan="col-span-2"
                                align="center"
                                isActive={sortKey === 'investimento_minimo'}
                                icon={getSortIcon('investimento_minimo')}
                                activeTitle={sortDirection === 'desc' ? 'Maior Aporte Mínimo no Topo (↑)' : 'Menor Aporte Mínimo no Topo (↓)'}
                                activeDescription={sortDirection === 'desc' ? 'Ordenando do maior valor mínimo exigido para o mais acessível.' : 'Ordenando dos investimentos mais acessíveis para os de maior aporte.'}
                                actionHint="Alternar maior / menor valor"
                                onClick={() => handleSort('investimento_minimo')}
                            />

                            <SortableHeader
                                colKey="isento_ir"
                                label="Isento Ir"
                                colSpan="col-span-1"
                                align="center"
                                isActive={isentoTop}
                                icon={getSortIcon('isento_ir')}
                                activeTitle="Priorizando Isentos de IR (↑)"
                                activeDescription="Investimentos isentos de Imposto de Renda (Sim) estão fixados no topo da tabela."
                                actionHint="Desativar priorização de isentos"
                                onClick={() => handleSort('isento_ir')}
                            />

                            <SortableHeader
                                colKey="vencimento"
                                label="Vencimento"
                                colSpan="col-span-2"
                                align="right"
                                isActive={sortKey === 'vencimento'}
                                icon={getSortIcon('vencimento')}
                                activeTitle={sortDirection === 'desc' ? 'Prazo Mais Longo no Topo (↑)' : 'Prazo Mais Curto no Topo (↓)'}
                                activeDescription={sortDirection === 'desc' ? 'Exibindo primeiro os títulos com data de vencimento mais distante.' : 'Exibindo primeiro os títulos com data de vencimento mais próxima.'}
                                actionHint="Alternar prazo longo / curto"
                                onClick={() => handleSort('vencimento')}
                            />
                        </div>

                        {/* Lista de Investimentos com suporte a Duplo Clique para abrir o Simulador */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pt-1.5 pr-0.5">
                            {filteredAndSortedInvestimentos.map((inv) => {
                                const rowKey = inv.id || (inv.produto + inv.vencimento);
                                const isExpanded = expandedRow === rowKey;
                                const isSelected = selectedRow === rowKey;

                                return (
                                    <div
                                        key={rowKey}
                                        onClick={() => setSelectedRow(rowKey)}
                                        onDoubleClick={() => handleDoubleClickRow(rowKey)}
                                        title="Clique duas vezes para abrir a simulação"
                                        className={`rounded-md transition-all cursor-pointer ${
                                            isExpanded
                                                ? 'bg-[#14181e] border border-[#00c47c] shadow-lg shadow-[#00c47c]/5'
                                                : isSelected
                                                    ? 'bg-[#191f27] border border-[#2a3441]'
                                                    : 'bg-[#14181e] border border-transparent hover:bg-[#181d24]'
                                        }`}
                                    >
                                        {/* Linha Principal do Investimento */}
                                        <div className="grid grid-cols-12 items-center py-5 px-7 text-sm">
                                            <div className="col-span-4 text-[#e2e8f0] font-normal truncate pr-4">
                                                {inv.produto}
                                            </div>
                                            <div className="col-span-3 text-[#94A3B8] text-center">
                                                {inv.rendimento}
                                            </div>
                                            <div className="col-span-2 text-[#94A3B8] text-center">
                                                {inv.investimento_minimo}
                                            </div>
                                            <div className="col-span-1 flex items-center justify-center">
                                                <span className={`w-2 h-2 rounded-full mr-2 ${inv.isento_ir ? 'bg-[#00c47c]' : 'bg-[#64748b]'}`}></span>
                                                <span className={inv.isento_ir ? 'text-[#00c47c]' : 'text-[#64748b]'}>
                                                    {inv.isento_ir ? 'Sim' : 'Não'}
                                                </span>
                                            </div>
                                            <div className="col-span-2 text-[#94A3B8] text-right pr-2">
                                                {inv.vencimento}
                                            </div>
                                        </div>

                                        {/* Painel Expandido no Duplo Clique (Apenas Input e Retornos Zerados) */}
                                        {isExpanded && (
                                            <div
                                                className="px-7 pb-5 pt-1"
                                                onClick={(e) => e.stopPropagation()}
                                                onDoubleClick={(e) => e.stopPropagation()}
                                            >
                                                <label className="block text-xs text-[#94A3B8] mb-2">
                                                    Quanto quer investir?
                                                </label>
                                                <div className="flex items-center justify-between">
                                                    {/* Input de Valor */}
                                                    <div className="w-[43%]">
                                                        <input
                                                            type="text"
                                                            placeholder="R$ 0,00"
                                                            value={valorInvestirInput}
                                                            onChange={(e) => setValorInvestirInput(e.target.value)}
                                                            className="w-full bg-[#181e25] border border-[#00c47c] rounded-md px-4 py-2.5 text-sm text-white placeholder-[#64748b] focus:outline-none focus:ring-1 focus:ring-[#00c47c]"
                                                        />
                                                    </div>

                                                    {/* Retorno Bruto (Zerado) */}
                                                    <div className="flex flex-col">
                                                        <span className="text-xs text-[#94A3B8] mb-0.5">Retorno Bruto</span>
                                                        <span className="text-lg font-medium text-[#00c47c]">R$ 0,00</span>
                                                    </div>

                                                    {/* Retorno Líquido (Zerado) */}
                                                    <div className="flex flex-col">
                                                        <span className="text-xs text-[#94A3B8] mb-0.5">Retorno Liquído</span>
                                                        <span className="text-lg font-medium text-[#00c47c]">R$ 0,00</span>
                                                    </div>

                                                    {/* Seta Verde Direita */}
                                                    <button
                                                        type="button"
                                                        className="text-[#00c47c] hover:text-[#00e08e] transition-colors p-2 mr-4 cursor-pointer"
                                                    >
                                                        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                            <line x1="5" y1="12" x2="19" y2="12" />
                                                            <polyline points="12 5 19 12 12 19" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Rodapé com Botões Exportar TXT e Copiar */}
                    <div className="px-10 py-4 bg-[#0e1217] border-t border-[#1c232d] flex items-center space-x-3.5 shrink-0">
                        <button 
                            onClick={() => window.pywebview && window.pywebview.api.exportar_txt(filteredAndSortedInvestimentos)}
                            className="flex items-center px-5 py-2.5 bg-[#14181e] border border-[#262f3b] text-[#cbd5e1] rounded-md text-xs font-medium hover:bg-[#1c222b] hover:text-white transition-colors"
                        >
                            <svg className="w-3.5 h-3.5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            Exportar TXT
                        </button>
                        <button 
                            onClick={() => window.pywebview && window.pywebview.api.copiar_dados(filteredAndSortedInvestimentos)}
                            className="flex items-center justify-center px-10 py-2.5 bg-[#00a86b] hover:bg-[#00c47c] text-white rounded-md text-xs font-semibold transition-colors"
                        >
                            Copiar
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
